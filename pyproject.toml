[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.8"
exclude = [
    "(?:^|/)venv(?:/|$)",
    "(?:^|/)\\.venv(?:/|$)",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 117
target-version = "py38"

[tool.ruff.lint]
# Keep the existing baseline while the wrapper is incrementally modernized.
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 117
target-version = ["py38"]

[tool.isort]
profile = "black"

[tool.bandit]
exclude_dirs = [".venv", "venv"]
skips = ["B101",]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = [
    "tests",
]
required_plugins = [
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-randomly>=3.15.0",
]
asyncio_mode = "strict"
addopts = [
    "-vvv",
    "--maxfail=1",
    "--strict-config",
    "--strict-markers",
    "--cov=themoviedb",
    "--cov-fail-under=80",
]
