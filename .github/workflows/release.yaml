name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Validate and stage the release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from packaging.version import InvalidVersion, Version

          tag = os.environ["RELEASE_TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          try:
              Version(version)
          except InvalidVersion as error:
              raise SystemExit(f"Release tag is not a valid PEP 440 version: {tag}") from error

          with open("themoviedb/_version.py", "w", encoding="utf-8") as version_file:
              version_file.write(f'__version__ = "{version}"\n')
          PY
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Upload package distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distribution to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/themoviedb/
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
